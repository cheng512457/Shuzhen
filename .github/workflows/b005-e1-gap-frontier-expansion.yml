name: B005 E1 gap and frontier literature expansion

on:
  pull_request:
    branches: [main]
    paths: ['triggers/run-b005-e1-*.txt']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

env:
  PYTHONUNBUFFERED: '1'
  PAGES_PER_QUERY: '10'

jobs:
  exclusion:
    name: Build B004 157917 DOI exclusion registry
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: B004-S4-1-first-10000-final
          path: prior_rounds/r01
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30203626164
      - uses: actions/download-artifact@v4
        with:
          name: B004-R02-30000-final
          path: prior_rounds/r02
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30225455814
      - uses: actions/download-artifact@v4
        with:
          name: B004-R03-30000-final
          path: prior_rounds/r03
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30227900079
      - uses: actions/download-artifact@v4
        with:
          name: B004-R04-30000-final
          path: prior_rounds/r04
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30228841196
      - uses: actions/download-artifact@v4
        with:
          name: B004-R05-30000-final
          path: prior_rounds/r05
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30230407916
      - uses: actions/download-artifact@v4
        with:
          name: B004-R06-final-remaining-pool
          path: prior_rounds/r06
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30232892046
      - name: Build and validate exclusion registry
        run: python scripts/b005_build_exclusion.py
      - uses: actions/upload-artifact@v4
        with:
          name: B005-B004-exclusion-registry
          path: out/
          retention-days: 14

  discover:
    name: ${{ matrix.k_domain }} ${{ matrix.stratum }}
    needs: exclusion
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        k_domain: [K01,K02,K03,K04,K05,K06,K07,K08,K09,K10,K11,K12,K13,K14,K15,K16]
        stratum: [gap,frontier]
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade requests
      - uses: actions/download-artifact@v4
        with:
          name: B005-B004-exclusion-registry
          path: exclusion_artifact
      - name: Discover DOI records absent from B004
        env:
          K_DOMAIN: ${{ matrix.k_domain }}
          STRATUM: ${{ matrix.stratum }}
        run: python scripts/b005_e1_discover.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B005-E1-${{ matrix.k_domain }}-${{ matrix.stratum }}
          path: out/
          retention-days: 14

  combine:
    name: Combine B005 E1 new candidates
    needs: discover
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: B005-E1-K*
          path: shard_artifacts
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: B005-B004-exclusion-registry
          path: exclusion_artifact
      - name: Global DOI de-duplication and quality gate
        run: python scripts/b005_e1_combine.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B005-E1-new-candidates-final
          path: out/
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B005-E1-summary
          path: |
            out/run_summary.json
            out/stage_report.md
          retention-days: 14
      - if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'B005 E1 did not produce run_summary.json. Inspect shard checkpoints.';
            if (fs.existsSync('out/run_summary.json')) {
              const s = JSON.parse(fs.readFileSync('out/run_summary.json','utf8'));
              body = `## B005 E1 automated report\n\n- Status: **${s.status}**\n- New unique DOIs: ${s.new_global_unique_dois}\n- Overlap with B004: ${s.overlap_with_B004}\n- K-domain counts: ${JSON.stringify(s.K_membership_counts)}\n- Next: ${s.next}`;
            }
            github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
