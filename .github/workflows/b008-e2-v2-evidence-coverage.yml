name: B008 E2 v2 strict evidence coverage verification

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'triggers/run-b008-e2v2-*.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  verify:
    name: Re-verify B008 formal coverage without relaxing relevance
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Download completed failed-run E2 outputs
        uses: actions/download-artifact@v4
        with:
          name: B008-E2-verified-formal-pool
          path: failed_e2_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30342135111
      - name: Download frozen prior cumulative database
        uses: actions/download-artifact@v4
        with:
          name: B004-B005-B006-B007-final-266798
          path: prior_database_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30327827563
      - name: Apply strict K11 evidence coverage correction and full audit
        run: python scripts/b008_e2_v2_coverage_verify.py
      - name: Build PR report
        if: always() && github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/run_summary.json')
          if not p.exists():
              body='B008 E2 v2 did not produce run_summary.json. Inspect the verification log.'
          else:
              d=json.loads(p.read_text(encoding='utf-8'))
              body='\n'.join([
                  '## B008 E2 v2 automated report','',
                  f"- Status: **{d.get('status','unknown')}**",
                  f"- Classified rows: {d.get('classified_rows','')}",
                  f"- Verified formal A/B pool: {d.get('formal_AB_download_pool','')}",
                  f"- Relevance: {d.get('relevance_counts',{})}",
                  f"- Priority: {d.get('priority_counts',{})}",
                  f"- Formal K domains: {d.get('formal_K_counts',{})}",
                  f"- Metadata: {d.get('metadata_status_counts',{})}",
                  f"- Invalid DOI: {d.get('invalid_doi','')}",
                  f"- Prior registry/overlap: {d.get('prior_registry_dois','')}/{d.get('prior_overlap','')}",
                  f"- K11 existing/reassigned/promoted: {d.get('K11_existing_formal_before','')}/{d.get('K11_strict_reassigned_existing_AB','')}/{d.get('K11_strict_promoted_from_C','')}",
                  f"- Stratified audit: {d.get('audit_status_counts',{})}; supported share {d.get('audit_supported_share','')}",
                  f"- Quality gate: {d.get('quality_gate',{})}",
                  f"- Next: {d.get('next_stage','')}"
              ])
          Path('out/pr_comment.md').write_text(body,encoding='utf-8')
          PY
      - name: Comment report on pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file out/pr_comment.md
      - name: Upload B008 E2 v2 verified formal pool
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B008-E2-V2-verified-formal-pool
          path: out/
          retention-days: 14
      - name: Upload B008 E2 v2 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B008-E2-V2-summary
          path: |
            out/run_summary.json
            out/stage_report.md
            out/pr_comment.md
          retention-days: 14
