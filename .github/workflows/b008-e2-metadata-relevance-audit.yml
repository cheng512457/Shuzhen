name: B008 E2 metadata verification and precision audit

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'triggers/run-b008-e2-*.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    name: Split B008 E1 candidates and rebuild prior registry
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download successful B008 E1 candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: B008-E1-high-precision-candidates
          path: e1_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30328236617
      - name: Download frozen B004+B005+B006+B007 cumulative database
        uses: actions/download-artifact@v4
        with:
          name: B004-B005-B006-B007-final-266798
          path: prior_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30327827563
      - name: Split candidates into eight stable shards
        run: python scripts/b008_e2_prepare.py
      - name: Upload B008 E2 input shards
        uses: actions/upload-artifact@v4
        with:
          name: B008-E2-input-shards
          path: out/
          retention-days: 14

  classify:
    name: Classify B008 shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --upgrade requests
      - name: Download B008 E2 input shards
        uses: actions/download-artifact@v4
        with:
          name: B008-E2-input-shards
          path: input_artifact
      - name: Complete metadata and assign provisional relevance
        env:
          SHARD: ${{ matrix.shard }}
        run: python scripts/b008_e2_classify.py
      - name: Upload classified shard checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B008-E2-shard${{ matrix.shard }}
          path: out/
          retention-days: 14

  combine:
    name: Verify B008 evidence and freeze formal pool
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Download all classified shards
        uses: actions/download-artifact@v4
        with:
          pattern: B008-E2-shard*
          path: shard_artifacts
          merge-multiple: false
      - name: Download frozen prior cumulative database
        uses: actions/download-artifact@v4
        with:
          name: B004-B005-B006-B007-final-266798
          path: prior_database_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30327827563
      - name: Apply conservative record-level verification and audit
        run: python scripts/b008_e2_combine_verify.py
      - name: Build PR report
        if: always() && github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/run_summary.json')
          if not p.exists():
              body='B008 E2 did not produce run_summary.json. Inspect saved shard checkpoints.'
          else:
              d=json.loads(p.read_text(encoding='utf-8'))
              body='\n'.join([
                  '## B008 E2 automated report','',
                  f"- Status: **{d.get('status','unknown')}**",
                  f"- Classified rows: {d.get('classified_rows','')}",
                  f"- Verified formal A/B pool: {d.get('formal_AB_download_pool','')}",
                  f"- Relevance: {d.get('relevance_counts',{})}",
                  f"- Priority: {d.get('priority_counts',{})}",
                  f"- Formal K domains: {d.get('formal_K_counts',{})}",
                  f"- Metadata: {d.get('metadata_status_counts',{})}",
                  f"- Invalid DOI: {d.get('invalid_doi','')}",
                  f"- Prior registry/overlap: {d.get('prior_registry_dois','')}/{d.get('prior_overlap','')}",
                  f"- Stratified audit: {d.get('audit_status_counts',{})}; supported share {d.get('audit_supported_share','')}",
                  f"- Quality gate: {d.get('quality_gate',{})}",
                  f"- Next: {d.get('next_stage','')}"
              ])
          Path('out/pr_comment.md').write_text(body,encoding='utf-8')
          PY
      - name: Comment report on pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file out/pr_comment.md
      - name: Upload B008 E2 complete result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B008-E2-verified-formal-pool
          path: out/
          retention-days: 14
      - name: Upload B008 E2 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B008-E2-summary
          path: |
            out/run_summary.json
            out/stage_report.md
            out/pr_comment.md
          retention-days: 14
